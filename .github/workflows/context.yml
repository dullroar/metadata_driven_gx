name: context
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secret guard on all tracked files
        run: python3 scripts/secret_guard.py --tracked
      - name: Secret guard on every commit of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/secret_guard.py --range "$BASE_SHA..$HEAD_SHA"
      - name: Check indexes, plans, links and secrets
        run: python3 scripts/check_context.py
      - name: Build and test the demo in Docker
        run: bash scripts/test_docker.sh
